server:
  port: 8083

spring:
  application:
    name: api-invoke

# 第三方天气：Key 通过环境变量或 application-local.yml 注入
apihub:
  weather:
    provider: amap
    amap:
      key: ${AMAP_KEY:}
      base-url: ${AMAP_BASE_URL:https://restapi.amap.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{traceId}] %-5level %logger{36} - %msg%n"
